name: Deploy

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          repository: SantoDE/slidev-theme-codecentric
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: decks/slidev-theme-codecentric

      - name: Checkout clusters-hcp-demo
        uses: actions/checkout@v4
        with:
          repository: SantoDE/clusters-hcp-demo
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: decks/clusters-hcp-demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: decks/clusters-hcp-demo/slides/package-lock.json

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Generate diagrams
        working-directory: decks/clusters-hcp-demo/slides
        run: |
          for f in diagrams/*.d2; do
            d2 "$f" "public/diagrams/$(basename "${f%.d2}.svg")"
          done

      - name: Generate QR code
        working-directory: decks/clusters-hcp-demo/slides
        run: |
          pip install qrcode[svg] --quiet
          python3 -c "
          import qrcode, qrcode.image.svg
          qr = qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_L, box_size=10, border=2)
          qr.add_data('https://slides.manuelzapf.io/from-clusters-to-controlplanes')
          qr.make(fit=True)
          qr.make_image(image_factory=qrcode.image.svg.SvgPathImage).save('public/qr-slides.svg')
          "

      - name: Install dependencies
        working-directory: decks/clusters-hcp-demo/slides
        run: npm ci

      - name: Build slides
        working-directory: decks/clusters-hcp-demo/slides
        run: npm run build -- --base /from-clusters-to-controlplanes/

      - name: Assemble site
        run: mkdir -p _site && cp -r decks/clusters-hcp-demo/slides/dist _site/from-clusters-to-controlplanes

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
